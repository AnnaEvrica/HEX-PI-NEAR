name: NEAR contract

on:
  push:
    paths: ['near/**', '.github/workflows/near-contract.yml']
  pull_request:
    paths: ['near/**', '.github/workflows/near-contract.yml']
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bridge tests
        working-directory: .
        run: node --test near/bridge/commitment.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Contract tests
        run: cargo test
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build the deployable contract
        run: cargo near build non-reproducible-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: hex-pi-ledger-wasm
          path: near/contract/target/near/hex_pi_ledger.wasm
